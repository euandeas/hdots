name: Check

# Runs Kansora's checks (build-scripts/check in euandeas/kansora) against this
# commit of kdots: builds kansora-dots, dry-runs the install, deploys the default
# dotfiles in a throwaway $HOME and validates the resulting niri config.
#
# On main, it then asks kansora to rebuild and publish the package repo. That
# needs a KANSORA_DISPATCH_TOKEN secret here: a fine-grained token with
# "Actions: read and write" on euandeas/kansora. Without it, the publish step is
# skipped and kansora's nightly run picks the change up.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    uses: euandeas/kansora/.github/workflows/check.yml@main

  publish:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Trigger kansora's package repo build
        env:
          GH_TOKEN: ${{ secrets.KANSORA_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::No KANSORA_DISPATCH_TOKEN secret; kansora's nightly build will publish this."
            exit 0
          fi
          gh workflow run repo.yml -R "${{ github.repository_owner }}/kansora"

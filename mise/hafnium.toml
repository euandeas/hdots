# Hafnium default dotfiles.
#
# Installed as /etc/mise/conf.d/hafnium.toml, which is mise's *system* config layer.
# Your global config (~/.config/mise/config.toml, e.g. your personal dotfiles repo)
# is loaded on top of this, so any entry there with the same target replaces the
# one below. That's the supported way to swap out a Hafnium default.
#
# Two kinds of entries:
#   managed  symlinks into /usr/share/hafnium/dots. They follow Hafnium updates
#            (dnf upgrade). Don't edit them; use the override files they include.
#   seeds    copied once with create_if_missing, then they're yours. Hafnium never
#            overwrites them. `hafnium-dots reset <target>` restores the default.
#
# hafnium-dots.service runs `hafnium-dots apply` at login. That deploys only the
# targets that are missing, so files you've changed are left alone. It also has DMS
# generate its default niri includes (keybinds, alt-tab, layout...) if they're missing.

[dotfiles]
# --- managed ---------------------------------------------------------------
# niri entrypoint: Hafnium defaults -> DMS-generated includes -> your local.kdl
"~/.config/niri/config.kdl" = { source = "/usr/share/hafnium/dots/niri/config.kdl" }

# --- seeds -----------------------------------------------------------------
# Your niri overrides. Included last, so it wins over everything else.
"~/.config/niri/local.kdl" = { source = "/usr/share/hafnium/dots/niri/local.kdl", mode = "copy", create_if_missing = true }

# DMS: Flexoki theme (/usr/share/hafnium/themes/flexoki.json). DMS rewrites this file from its settings UI.
"~/.config/dms/settings.json" = { source = "/usr/share/hafnium/dots/dms/settings.json", mode = "copy", create_if_missing = true }

# DMS clipboard history: 100 entries, 5 MiB each, cleared after 2 days and at login
"~/.config/dms/clsettings.json" = { source = "/usr/share/hafnium/dots/dms/clsettings.json", mode = "copy", create_if_missing = true }

# DMS session: dark mode, Flexoki orb wallpapers that switch with light/dark mode
"~/.local/state/dms/session.json" = { source = "/usr/share/hafnium/dots/dms/session.json", mode = "copy", create_if_missing = true }

# Ghostty, the default terminal
"~/.config/ghostty/config" = { source = "/usr/share/hafnium/dots/ghostty/config", mode = "copy", create_if_missing = true }
